          PATCH_EOF
          base64 -d ../patch.b64 | gunzip > ../voxy-android.patch
          git apply --check ../voxy-android.patch
          git apply --whitespace=nowarn ../voxy-android.patch
          sed -i 's/^archives_base_name.*/archives_base_name = voxy-android/' gradle.properties
          sed -i 's/^mod_version.*/mod_version = 0.2.16-beta-android/' gradle.properties
          test -f src/main/java/me/cortex/voxy/client/core/gl/GLCompat.java
          echo "patch applied"; git status --short | wc -l

      - name: Build
        working-directory: voxy-src
        run: ./gradlew build -x test --no-daemon --stacktrace

      - name: Collect jar
        run: |
          mkdir -p dist
          ls -la voxy-src/build/libs
          JAR=$(ls voxy-src/build/libs/*.jar | grep -v -e '-dev' -e '-sources' | head -1)
          cp "$JAR" dist/
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxy-android-jar
          path: dist/*.jar

      - name: Publish release (easy download on a phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Voxy Android build ${{ github.run_number }}
          body: |
            Voxy 0.2.16-beta (1.21.11) with the Android/GLES patch.
            Install with Sodium 0.8.12 exactly (mc1.21.11), Fabric API. Do NOT install the original Voxy next to it. Personal use only.
          files: dist/*.jar
